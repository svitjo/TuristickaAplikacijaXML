services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build:
      context: ./AuthService/AuthService/AuthService
    dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://mongo:27017
      MongoDB__DatabaseName: AuthDb
      Jwt__Key: TourisAuthSuperSecretKey_ChangeInProduction_32chars!
      Jwt__Issuer: AuthService
      Jwt__Audience: TourisApp
    depends_on:
      - mongo

  blog-service:
    build:
      context: ./BlogService/BlogService/BlogService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://mongo:27017
      MongoDB__DatabaseName: BlogDb
      Jwt__Key: TourisAuthSuperSecretKey_ChangeInProduction_32chars!
      Jwt__Issuer: AuthService
      Jwt__Audience: TourisApp
    depends_on:
      - mongo

  tour-service:
    build:
      context: ./TourService/TourService/TourService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://mongo:27017
      MongoDB__DatabaseName: TourDb
      Jwt__Key: TourisAuthSuperSecretKey_ChangeInProduction_32chars!
      Jwt__Issuer: AuthService
      Jwt__Audience: TourisApp
    depends_on:
      - mongo

  purchase-service:
    build:
      context: ./PurchaseService/PurchaseService/PurchaseService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://mongo:27017
      MongoDB__DatabaseName: PurchaseDb
      Jwt__Key: TourisAuthSuperSecretKey_ChangeInProduction_32chars!
      Jwt__Issuer: AuthService
      Jwt__Audience: TourisApp
      Services__Tour: http://tour-service:8080
    depends_on:
      - mongo
      - tour-service

  tour-execution-service:
    build:
      context: ./TourExecutionService/TourExecutionService/TourExecutionService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://mongo:27017
      MongoDB__DatabaseName: TourExecutionDb
      Jwt__Key: TourisAuthSuperSecretKey_ChangeInProduction_32chars!
      Jwt__Issuer: AuthService
      Jwt__Audience: TourisApp
      Services__Tour: http://tour-service:8080
      Services__Purchase: http://purchase-service:8080
    depends_on:
      - mongo
      - tour-service
      - purchase-service

  gateway:
    build:
      context: ./GatewayService/GatewayService/GatewayService
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      - auth-service
      - blog-service
      - tour-service
      - purchase-service
      - tour-execution-service

  frontend:
    build:
      context: ./FE/touris-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  mongo_data:
