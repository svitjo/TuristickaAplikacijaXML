server {
    listen 80 default_server; # replaced by start.sh with $PORT on Render
    server_name _;
    root /var/www/html;
    index index.html;

    # Friendly JSON instead of raw nginx HTML for API failures
    error_page 502 503 504 /api-error.json;

    location = /api-error.json {
        default_type application/json;
        add_header Content-Type application/json always;
        return 502 '{"message":"Server se jos pokrece. Sacekajte 20-40 sekundi pa pokusajte ponovo."}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_intercept_errors on;
    }

    location / {
        try_files $uri /index.html;
    }
}
